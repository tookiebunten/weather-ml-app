name: Weather ML App CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-ship:
    runs-on: ubuntu-latest

    steps:


# SET UP


      # Download Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install project packages
      - name: Install Flask and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


# TESTS


      # Smoke Test
      - name: Run Smoke Tests
        run: |
          python -m unittest tests/smoke_test.py

      # Unit Test
      - name: Run Unit Tests
        run: |
          python -m unittest tests/unit_test.py

      # Integration Test
      - name: Run Integration Tests
        run: |
          python -m unittest tests/integration_test.py


# DOCKER

      # Login to DockerHub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker Image
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dbunte300/weather-ml-app:v1

      # Container Launch Test
      - name: Test Docker Container Launch
        run: |
          docker run -d --name weather-test dbunte300/weather-ml-app:v1
          docker exec weather-test python --version

      # Push Docker Image
      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: dbunte300/weather-ml-app:v1
