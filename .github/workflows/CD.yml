name: Weather ML App CD Pipeline

on:
  workflow_run:
    workflows: ["Weather ML App CI Pipeline"]
    types:
      - completed

env:
  IMAGE_TAG: v2

jobs:
  deploy:
    # Only deploy if CI succeeded on main
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes Files
        run: ls -la k8s

      - name: Set image tag in deployment
        run: |
          sed -i "s|image: .*|image: dbunte300/weather-ml-app:${{ env.IMAGE_TAG }}|" k8s/deployment.yaml
          grep "image:" k8s/deployment.yaml

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Check Deployment Status
        run: |
          kubectl get deployments
          kubectl get services
          kubectl get pods

      - name: Verify Rollout
        run: kubectl rollout status deployment/weather-ml-app --timeout=180s
